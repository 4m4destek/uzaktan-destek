name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyinstaller mss numpy opencv-python-headless Pillow
      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip
          Copy-Item "ffmpeg-release-essentials/bin/ffmpeg.exe" .
      - name: Download zrok2
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/openziti/zrok/releases/latest"
          $tag = $release.tag_name
          $ver = $tag -replace "^v",""
          $url = "https://github.com/openziti/zrok/releases/download/$tag/zrok_${ver}_windows_amd64.tar.gz"
          Write-Host "Downloading: $url"
          Invoke-WebRequest -Uri $url -OutFile zrok_windows.tar.gz
          tar -xf zrok_windows.tar.gz
          Get-ChildItem -Recurse -Filter "zrok2.exe" | ForEach-Object { Copy-Item $_.FullName "./zrok2.exe" -Force }
          Get-ChildItem zrok2.exe
      - name: Build
        run: pyinstaller --onefile --noconsole --add-binary "ffmpeg.exe;." --add-binary "zrok2.exe;." --hidden-import mss --hidden-import cv2 --hidden-import numpy --hidden-import PIL --name "UzaktanDesteK" client.py
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: dist/UzaktanDesteK.exe
