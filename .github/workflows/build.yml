name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyinstaller mss numpy opencv-python-headless Pillow
      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip
          $ffmpeg = Get-ChildItem -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "./ffmpeg.exe" -Force
          Write-Host "ffmpeg size: $((Get-Item ffmpeg.exe).Length)"
      - name: Download zrok2
        shell: pwsh
        run: |
          $api = "https://api.github.com/repos/openziti/zrok/releases/latest"
          $release = Invoke-RestMethod -Uri $api
          $asset = $release.assets | Where-Object { $_.name -like "*windows*amd64*" }
          Write-Host "Asset: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile zrok_win.tar.gz
          tar -xzf zrok_win.tar.gz
          if (Test-Path "./zrok2.exe") {
            Write-Host "zrok2.exe already in current dir"
          } else {
            $exe = Get-ChildItem -Recurse -Filter "zrok2.exe" | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName "./zrok2.exe" -Force }
          }
          Write-Host "zrok2 size: $((Get-Item zrok2.exe).Length)"
      - name: Build
        run: pyinstaller --onefile --noconsole --add-binary "ffmpeg.exe;." --add-binary "zrok2.exe;." --hidden-import mss --hidden-import cv2 --hidden-import numpy --hidden-import PIL --name "UzaktanDesteK" client.py
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: dist/UzaktanDesteK.exe
